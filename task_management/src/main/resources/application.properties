spring.application.name=management

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/Task_Manager
spring.datasource.username=bvm
spring.datasource.password=@MySQL123
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.org.springframework.security=DEBUG

# port
server.port=8081

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# kafka topics listened by the application
kafka.topic.userAuthenticated=userAuthenticated
kafka.topic.userCreated=userCreated
kafka.topic.userDeleted=userDeleted
kafka.topic.userUpdated=userUpdated
kafka.topic.userRoleUpdated=userRoleUpdated
kafka.topic.userLoggedOut=userLoggedOut


